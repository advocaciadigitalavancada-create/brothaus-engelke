<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Engelke • Forno</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#12100E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Forno Engelke">
  <link rel="icon" type="image/svg+xml" href="../assets/cisne_vetor_oficial.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="../config.js"></script>
  <script src="story-generator.js"></script>

  <style>
    :root {
      --bg: #12100E;
      --card: #1C1917;
      --gold: #C89B58;
      --gold-light: #E0BA7E;
      --gold-glow: rgba(200, 155, 88, 0.35);
      --ink: #FFFFFF;
      --ink-muted: #8E867C;
      --active-bg: rgba(200, 155, 88, 0.18);
      --active-border: #C89B58;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: calc(var(--safe-top) + 0.75rem) 1.15rem calc(var(--safe-bottom) + 1.15rem) 1.15rem;
      max-width: 440px;
      margin: 0 auto;
      justify-content: space-between;
    }

    /* Top Bar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .brand svg {
      width: 32px;
      height: 32px;
      color: var(--gold);
    }

    .brand-name {
      font-family: 'Oswald', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 1;
    }

    .brand-sub {
      font-size: 0.65rem;
      color: var(--gold);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .dot-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
      transition: all 0.3s;
    }

    .dot-status.offline {
      background: #D97706;
      box-shadow: 0 0 8px rgba(217, 119, 6, 0.6);
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: var(--ink-muted);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn-icon svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* Section Titles */
    .section-label {
      font-family: 'Oswald', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 1rem;
      margin-bottom: 0.45rem;
    }

    /* Big Bread Buttons Grid (1 Tap) */
    .bread-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
    }

    .bread-btn {
      background: var(--card);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 0.95rem 0.75rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      transition: all 0.15s ease;
      color: var(--ink);
    }

    .bread-btn:active {
      transform: scale(0.96);
    }

    .bread-btn.selected {
      background: var(--active-bg);
      border-color: var(--active-border);
      box-shadow: 0 0 18px rgba(200, 155, 88, 0.28);
    }

    .bread-icon {
      font-size: 1.35rem;
      line-height: 1;
    }

    .bread-name {
      font-family: 'Oswald', sans-serif;
      font-size: 0.96rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.15;
    }

    .bread-btn.selected .bread-name {
      color: var(--gold-light);
    }

    /* Campo para Digitar Outro Pão */
    .custom-input-box {
      display: none;
      margin-top: 0.55rem;
    }

    .custom-input-box.open {
      display: block;
    }

    .text-input {
      width: 100%;
      background: #0E0C0B;
      border: 1.5px solid var(--gold);
      border-radius: 12px;
      padding: 0.85rem 0.95rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: #FFFFFF;
      outline: none;
    }

    /* Horários Rápidos */
    .time-scroll {
      display: flex;
      gap: 0.45rem;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .time-pill {
      background: var(--card);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 0.6rem 0.95rem;
      font-family: 'Oswald', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .time-pill:active {
      transform: scale(0.95);
    }

    .time-pill.selected {
      background: var(--gold);
      color: #12100E;
      border-color: var(--gold);
      font-weight: 700;
      box-shadow: 0 2px 10px rgba(200, 155, 88, 0.35);
    }

    /* Botão Gigante de Publicação */
    .cta-container {
      margin-top: 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn-fire {
      background: linear-gradient(135deg, #E0BA7E 0%, #C89B58 45%, #A67C3B 100%);
      color: #12100E;
      border: none;
      border-radius: 18px;
      padding: 1.2rem 1rem;
      font-family: 'Oswald', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 28px var(--gold-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: all 0.15s ease;
      width: 100%;
    }

    .btn-fire:active {
      transform: scale(0.97);
      box-shadow: 0 2px 10px rgba(200, 155, 88, 0.2);
    }

    .btn-fire.loading {
      opacity: 0.7;
      pointer-events: none;
    }

    .btn-quiet {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--ink-muted);
      border-radius: 12px;
      padding: 0.75rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-quiet:active {
      background: rgba(255, 255, 255, 0.05);
      color: var(--ink);
    }

    /* Toast Minimalista */
    .toast {
      position: fixed;
      top: calc(var(--safe-top) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(-40px);
      background: #1F1B18;
      border: 1px solid var(--gold);
      color: #FFFFFF;
      padding: 0.75rem 1.25rem;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    /* Modal de Configurações Discreto */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 90;
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      background: #1C1917;
      border: 1px solid rgba(200, 155, 88, 0.3);
      border-radius: 20px;
      padding: 1.4rem;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
  </style>
</head>
<body>

  <!-- TOAST FLUTUANTE -->
  <div class="toast" id="toast"></div>

  <!-- TOPO: MARCA & STATUS -->
  <header>
    <div class="brand">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="50" cy="50" r="44" stroke-width="1.8" stroke-opacity="0.5" />
        <circle cx="50" cy="50" r="39" stroke-width="2.6" />
        <path d="M 66 33 C 65 24 59 20 55 21 C 51.5 22.5 52 30 53.5 38 C 55.5 48 62 58 70 67 C 75 72.5 77.8 75.8 78.5 77.5" stroke-width="2.8" />
        <path d="M 59 55 C 44 54 28 55 23 60 C 20.5 62.5 21.5 65.5 26 66.5 C 36 67.5 46 68 47.5 68.5 C 36 71 23 73.5 21.5 77 C 20.5 80 23.5 81.5 33 81.5 C 48 81.5 68 80.5 78.5 77.5" stroke-width="2.8" />
      </svg>
      <div>
        <div class="brand-name">ENGELKE</div>
        <div class="brand-sub">Painel do Forno</div>
      </div>
    </div>

    <div class="header-actions">
      <div class="dot-status" id="dot-status" title="Conexão"></div>
      <a href="../index.html" target="_blank" class="btn-icon" title="Ver Site">
        <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </a>
      <button class="btn-icon" onclick="abrirSettings()" title="Configurações">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <!-- CENTRO: SELEÇÃO RÁPIDA -->
  <main>
    <!-- QUAL PÃO SAIU? -->
    <div class="section-label">Qual pão está saindo?</div>
    <div class="bread-grid">
      <button type="button" class="bread-btn selected" onclick="escolherPao('Sourdough Tradicional Demeter', this)">
        <span class="bread-icon">🥖</span>
        <span class="bread-name">Sourdough Demeter</span>
      </button>
      <button type="button" class="bread-btn" onclick="escolherPao('Baguetes Francesas de Tradição', this)">
        <span class="bread-icon">🥖</span>
        <span class="bread-name">Baguetes</span>
      </button>
      <button type="button" class="bread-btn" onclick="escolherPao('Pão 100% Centeio Roggenbrot', this)">
        <span class="bread-icon">🍞</span>
        <span class="bread-name">100% Centeio</span>
      </button>
      <button type="button" class="bread-btn" onclick="escolherPao('Sachertorte Vienense de 1832', this)">
        <span class="bread-icon">🎂</span>
        <span class="bread-name">Sachertorte</span>
      </button>
    </div>

    <!-- BOTÃO DISCRETO PARA ESCREVER OUTRO PÃO -->
    <div style="margin-top: 0.45rem;">
      <button type="button" class="bread-btn" id="btn-outro-pao" style="width:100%; flex-direction:row; align-items:center; justify-content:center; gap:0.5rem; padding:0.6rem;" onclick="ativarOutroPao()">
        <span>✏️</span>
        <span style="font-family:'Oswald',sans-serif; font-size:0.85rem; letter-spacing:0.04em; text-transform:uppercase;">Digitar outro pão...</span>
      </button>
      <div class="custom-input-box" id="box-outro-pao">
        <input type="text" id="input-custom-pao" class="text-input" placeholder="Ex: Focaccia de Alecrim com Flor de Sal">
      </div>
    </div>

    <!-- HORÁRIO -->
    <div class="section-label">Quando?</div>
    <div class="time-scroll">
      <button type="button" class="time-pill selected" onclick="escolherHorario('Saindo Agora!', this)">🔥 Agora!</button>
      <button type="button" class="time-pill" onclick="escolherHorario('Hoje às 15h30', this)">⏰ 15h30</button>
      <button type="button" class="time-pill" onclick="escolherHorario('Hoje às 17h00', this)">⏰ 17h00</button>
      <button type="button" class="time-pill" onclick="ativarOutroHorario(this)">✏️ Outro</button>
    </div>
    <div class="custom-input-box" id="box-outro-horario">
      <input type="text" id="input-custom-horario" class="text-input" placeholder="Ex: Hoje às 16h15 ou Amanhã 07h30">
    </div>
  </main>

  <!-- BASE: O BOTÃO HERO -->
  <div class="cta-container">
    <button type="button" class="btn-fire" id="btn-publicar" onclick="publicarFornada()">
      <span>🔥 Publicar & Baixar Story</span>
    </button>
    <button type="button" class="btn-quiet" onclick="voltarRitmoNormal()">
      🥖 Encerrar fornada e voltar à vitrine normal
    </button>
  </div>

  <!-- MODAL DE CONFIGURAÇÕES (APENAS CASO PRECISE CONFIGURAR A URL) -->
  <div class="modal" id="modal-settings">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="font-family:'Oswald',sans-serif; font-size:1.1rem; text-transform:uppercase;">Configurações</h3>
        <button class="btn-icon" onclick="fecharSettings()">&times;</button>
      </div>
      <div>
        <label style="font-size:0.75rem; color:var(--ink-muted); text-transform:uppercase; font-weight:600;">URL do Google Apps Script (/exec)</label>
        <input type="url" id="input-api-url" class="text-input" style="font-size:0.8rem; margin-top:0.3rem;" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <button class="btn-fire" style="padding:0.8rem; font-size:1rem; border-radius:12px;" onclick="salvarSettings()">
        Salvar
      </button>
    </div>
  </div>

  <!-- LÓGICA ULTRA-LEVE & VELOZ -->
  <script>
    let state = JSON.parse(JSON.stringify(window.ENGELKE_CONFIG.DEFAULT_DATA));
    let paoAtual = 'Sourdough Tradicional Demeter';
    let horarioAtual = 'Saindo Agora!';

    // Inicialização direta, sem barreiras
    document.addEventListener('DOMContentLoaded', () => {
      const cached = window.ENGELKE_CONFIG.getCachedData();
      if (cached) state = cached;
      carregarDoServidor();
    });

    function escolherPao(nome, el) {
      paoAtual = nome;
      document.querySelectorAll('.bread-btn').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
      document.getElementById('box-outro-pao').classList.remove('open');
      if (navigator.vibrate) navigator.vibrate(20);
    }

    function ativarOutroPao() {
      document.querySelectorAll('.bread-grid .bread-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById('btn-outro-pao').classList.add('selected');
      const box = document.getElementById('box-outro-pao');
      box.classList.add('open');
      const input = document.getElementById('input-custom-pao');
      input.focus();
      if (navigator.vibrate) navigator.vibrate(20);
    }

    function escolherHorario(hora, el) {
      horarioAtual = hora;
      document.querySelectorAll('.time-pill').forEach(p => p.classList.remove('selected'));
      el.classList.add('selected');
      document.getElementById('box-outro-horario').classList.remove('open');
      if (navigator.vibrate) navigator.vibrate(20);
    }

    function ativarOutroHorario(el) {
      document.querySelectorAll('.time-pill').forEach(p => p.classList.remove('selected'));
      el.classList.add('selected');
      const box = document.getElementById('box-outro-horario');
      box.classList.add('open');
      const input = document.getElementById('input-custom-horario');
      input.focus();
      if (navigator.vibrate) navigator.vibrate(20);
    }

    async function publicarFornada() {
      const btn = document.getElementById('btn-publicar');
      btn.classList.add('loading');
      btn.textContent = 'Enviando...';

      // Captura o pão (seja o botão ou o texto digitado)
      if (document.getElementById('box-outro-pao').classList.contains('open')) {
        const customPao = document.getElementById('input-custom-pao').value.trim();
        if (customPao) paoAtual = customPao;
      }

      // Captura o horário
      if (document.getElementById('box-outro-horario').classList.contains('open')) {
        const customHora = document.getElementById('input-custom-horario').value.trim();
        if (customHora) horarioAtual = customHora;
      }

      state.config.status_forno = 'saindo_agora';
      state.config.pao_destaque_hoje = paoAtual;
      state.config.proxima_fornada = horarioAtual;
      state.config.alerta_ativo = true;
      state.config.alerta_texto = `🔥 Fornada de ${paoAtual} saindo agora do lastro de pedra!`;
      state.config.ultima_atualizacao = new Date().toISOString();

      window.ENGELKE_CONFIG.setCachedData(state);
      if (navigator.vibrate) navigator.vibrate([50, 50, 50]);

      // 1. Gera e baixa o Story do Instagram
      try {
        await window.EngelkeStoryGenerator.baixarStoryPNG(state, `story-${Date.now()}.png`);
        mostrarToast('🔥 Fornada no ar & Story baixado!');
      } catch (err) {
        console.warn('Erro ao gerar story:', err);
        mostrarToast('🔥 Fornada publicada!');
      }

      // 2. Sincroniza com o Google Sheets
      const apiUrl = window.ENGELKE_CONFIG.getApiUrl();
      if (apiUrl) {
        try {
          const payload = {
            pin: '1832',
            config: state.config,
            cronograma: state.cronograma
          };
          fetch(apiUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }).catch(e => console.log('Envio bg:', e));
        } catch (e) {}
      }

      setTimeout(() => {
        btn.classList.remove('loading');
        btn.textContent = '🔥 Publicar & Baixar Story';
      }, 1500);
    }

    async function voltarRitmoNormal() {
      if (!confirm('Deseja encerrar o alerta de fornada quente e voltar ao ritmo normal?')) return;

      state.config.status_forno = 'ativo';
      state.config.alerta_ativo = false;
      state.config.alerta_texto = '🥖 Pães frescos disponíveis no balcão da Brothaus.';
      state.config.ultima_atualizacao = new Date().toISOString();
      window.ENGELKE_CONFIG.setCachedData(state);

      const apiUrl = window.ENGELKE_CONFIG.getApiUrl();
      if (apiUrl) {
        try {
          fetch(apiUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin: '1832', config: state.config, cronograma: state.cronograma })
          });
        } catch (e) {}
      }

      mostrarToast('🥖 Vitrine normal ativada!');
      if (navigator.vibrate) navigator.vibrate(30);
    }

    async function carregarDoServidor() {
      const apiUrl = window.ENGELKE_CONFIG.getApiUrl();
      const dot = document.getElementById('dot-status');
      if (!apiUrl) {
        dot.className = 'dot-status offline';
        return;
      }
      try {
        const res = await fetch(`${apiUrl}?action=get`);
        const json = await res.json();
        if (json.success && json.data) {
          state = json.data;
          window.ENGELKE_CONFIG.setCachedData(state);
          dot.className = 'dot-status';
        }
      } catch (e) {
        dot.className = 'dot-status offline';
      }
    }

    function mostrarToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function abrirSettings() {
      document.getElementById('input-api-url').value = window.ENGELKE_CONFIG.getApiUrl();
      document.getElementById('modal-settings').classList.add('open');
    }

    function fecharSettings() {
      document.getElementById('modal-settings').classList.remove('open');
    }

    function salvarSettings() {
      const url = document.getElementById('input-api-url').value.trim();
