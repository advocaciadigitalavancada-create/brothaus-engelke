<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Top arc: left to right, curving upwards (clockwise) -->
    <path id="top-arc" d="M 85,250 A 165,165 0 0,1 415,250" fill="none" />
    
    <!-- Bottom arc: left to right, curving downwards (counter-clockwise relative to center, so text is upright!) -->
    <path id="bottom-arc" d="M 85,250 A 165,165 0 0,0 415,250" fill="none" />

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&amp;display=swap');
      .seal-text {
        font-family: 'Oswald', -apple-system, sans-serif;
        font-size: 25px;
        font-weight: 600;
        fill: #94603B;
        letter-spacing: 0.17em;
        text-anchor: middle;
      }
      .seal-ring-outer {
        stroke: #94603B;
        stroke-width: 4.5;
        fill: none;
      }
      .seal-ring-hairline {
        stroke: #94603B;
        stroke-width: 1.5;
        stroke-opacity: 0.45;
        fill: none;
      }
      .seal-ring-inner {
        stroke: #94603B;
        stroke-width: 3.0;
        fill: none;
      }
      .seal-swan {
        fill: #94603B;
      }
    </style>
  </defs>

  <!-- Outer Double Rings with comfortable margin -->
  <circle cx="250" cy="250" r="228" class="seal-ring-outer" />
  <circle cx="250" cy="250" r="218" class="seal-ring-hairline" />

  <!-- Inner Ring bounding text band -->
  <circle cx="250" cy="250" r="148" class="seal-ring-inner" />

  <!-- Arched Texts -->
  <text class="seal-text">
    <textPath href="#top-arc" startOffset="50%">DESDE 2017</textPath>
  </text>
  <text class="seal-text">
    <textPath href="#bottom-arc" startOffset="50%">RIO TAVARES • FLORIANÓPOLIS</textPath>
  </text>

