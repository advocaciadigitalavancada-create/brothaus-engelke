<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Top arc: CERTIFICADO ORGÂNICO -->
    <path id="org-top-arc" d="M 85,250 A 165,165 0 0,1 415,250" fill="none" />
    <!-- Bottom arc: DESDE 2017 • SANTA CATARINA -->
    <path id="org-bottom-arc" d="M 85,250 A 165,165 0 0,0 415,250" fill="none" />

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Playfair+Display:ital,wght@1,500&amp;display=swap');
      .org-text-top {
        font-family: 'Oswald', -apple-system, sans-serif;
        font-size: 24px;
        font-weight: 700;
        fill: #334436;
        letter-spacing: 0.16em;
        text-anchor: middle;
      }
      .org-text-bottom {
        font-family: 'Oswald', -apple-system, sans-serif;
        font-size: 21px;
        font-weight: 600;
        fill: #94603B;
        letter-spacing: 0.15em;
        text-anchor: middle;
      }
      .org-ring-outer {
        stroke: #334436;
        stroke-width: 4.0;
        fill: none;
      }
      .org-ring-dashed {
        stroke: #94603B;
        stroke-width: 1.5;
        stroke-dasharray: 4 3;
        fill: none;
      }
      .org-ring-inner {
        stroke: #334436;
        stroke-width: 2.5;
        fill: none;
      }
    </style>
  </defs>

  <circle cx="250" cy="250" r="236" class="org-ring-outer" />
  <circle cx="250" cy="250" r="226" class="org-ring-dashed" />
  <circle cx="250" cy="250" r="150" class="org-ring-inner" />

  <!-- Arched Texts -->
  <text class="org-text-top">
    <textPath href="#org-top-arc" startOffset="50%">CERTIFICADO ORGÂNICO</textPath>
  </text>
  <text class="org-text-bottom">
    <textPath href="#org-bottom-arc" startOffset="50%">DESDE 2017 • BRASIL</textPath>
  </text>

  <!-- Central Organic Sprout / Wheat Icon with 100% Raw Demeter Soul -->
  <g transform="translate(250, 250) scale(1.15)">
    <!-- Wheat Stalk and Sprout Leaves -->
    <path d="M0,55 C-2,15 2,-25 0,-62" stroke="#334436" stroke-width="3" stroke-linecap="round" fill="none" />
    
    <!-- Left Leaf / Grain -->
    <path d="M-2,10 C-22,8 -32,-10 -25,-26 C-18,-18 -8,-5 -2,5" fill="#94603B" opacity="0.9" />
    <!-- Right Leaf / Grain -->
    <path d="M2,-5 C22,-7 32,-25 25,-41 C18,-33 8,-20 2,-10" fill="#334436" opacity="0.9" />
    <!-- Upper Left Grain -->
    <path d="M-2,-20 C-20,-22 -28,-38 -20,-50 C-14,-42 -6,-32 -2,-25" fill="#334436" opacity="0.9" />
    <!-- Upper Right Grain -->
    <path d="M2,-35 C20,-37 28,-53 20,-65 C14,-57 6,-47 2,-40" fill="#94603B" opacity="0.9" />
    <!-- Tip Sprout -->
    <path d="M0,-62 C-6,-72 0,-82 0,-82 C0,-82 6,-72 0,-62 Z" fill="#334436" />
    
    <!-- Year Tag Center -->
    <rect x="-38" y="28" width="76" height="22" rx="4" fill="#334436" />
    <text x="0" y="44" font-family="'Oswald', sans-serif" font-size="14" font-weight="700" fill="#F7F5F0" text-anchor="middle" letter-spacing="0.1em">100% PURO</text>
  </g>
</svg>